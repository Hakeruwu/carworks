
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Works | Games</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  user-select: none;
}

body {
  background: #0d0e12;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  height: 75px;
  background: #171920;
  border-bottom: 1px solid #292c36;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 5%;
  position: sticky;
  top: 0;
  z-index: 5;
}

.logo {
  font-size: 27px;
  font-weight: 900;
  letter-spacing: 2px;
}

.logo span {
  color: #42caff;
}

.header-right {
  color: #8e96a8;
  font-size: 13px;
}

.hero {
  padding: 45px 5% 25px;
}

.hero h1 {
  font-size: 36px;
  margin-bottom: 10px;
}

.hero p {
  color: #8e96a8;
  margin-bottom: 25px;
}

.search {
  width: 100%;
  max-width: 600px;
  padding: 15px;
  border: 1px solid #303442;
  background: #1b1e27;
  border-radius: 9px;
  color: white;
  font-size: 15px;
  outline: none;
}

.search:focus {
  border-color: #42caff;
}

.categories {
  display: flex;
  gap: 10px;
  padding: 10px 5% 25px;
  flex-wrap: wrap;
}

.category {
  border: 1px solid #303442;
  background: #1b1e27;
  color: #aaa;
  padding: 11px 20px;
  border-radius: 20px;
  cursor: pointer;
}

.category:hover,
.category.active {
  background: #42caff;
  color: #080b10;
}

.section {
  padding: 10px 5% 50px;
}

.section-title {
  margin-bottom: 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.section-title p {
  color: #777f91;
  font-size: 13px;
}

.games {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(190px,1fr));
  gap: 20px;
}

.game {
  background: #191c24;
  border: 1px solid #292e3b;
  border-radius: 12px;
  overflow: hidden;
  transition: .2s;
  cursor: pointer;
}

.game:hover {
  transform: translateY(-5px);
  border-color: #42caff;
}

.thumbnail {
  height: 135px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  background: #242938;
  overflow: hidden;
}

.thumbnail img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.placeholder {
  font-size: 55px;
}

.game-info {
  padding: 14px;
}

.game-info h3 {
  font-size: 16px;
  margin-bottom: 8px;
}

.game-info p {
  color: #858da0;
  font-size: 12px;
}

.game-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 14px;
}

.tag {
  color: #42caff;
  font-size: 11px;
}

.favorite {
  background: none;
  border: none;
  color: #777f91;
  font-size: 20px;
  cursor: pointer;
}

.favorite.active {
  color: #ffce55;
}

#player {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 20;
  background: #0d0e12;
  padding: 15px;
}

.player-top {
  height: 55px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.player-top button {
  padding: 11px 18px;
  background: #242938;
  color: white;
  border: none;
  border-radius: 7px;
  cursor: pointer;
}

.player-content {
  height: calc(100% - 65px);
  background: #191c24;
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.player-content iframe {
  width: 100%;
  height: 100%;
  border: none;
  background: white;
}

.game-message {
  text-align: center;
  padding: 30px;
}

.game-message p {
  color: #9ba3b4;
  margin: 15px 0;
}

.play-button {
  background: #42caff;
  color: #080b10;
  border: none;
  padding: 13px 25px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

.empty {
  color: #858da0;
  padding: 30px 0;
}

@media(max-width:600px) {
  .games {
    grid-template-columns: repeat(2,1fr);
    gap: 10px;
  }

  .thumbnail {
    height: 105px;
  }

  .hero h1 {
    font-size: 27px;
  }

  .logo {
    font-size: 21px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">CAR <span>WORKS</span></div>
  <div class="header-right">GAME LIBRARY</div>
</header>

<section class="hero">
  <h1>Discover Games</h1>
  <p>Find a game. Click. Play.</p>

  <input
    class="search"
    id="search"
    placeholder="Search for games..."
    oninput="renderGames()"
  >
</section>

<nav class="categories">
  <button class="category active" onclick="setCategory('All',this)">All Games</button>
  <button class="category" onclick="setCategory('Arcade',this)">Arcade</button>
  <button class="category" onclick="setCategory('Racing',this)">Racing</button>
  <button class="category" onclick="setCategory('Platformer',this)">Platformer</button>
  <button class="category" onclick="setCategory('Puzzle',this)">Puzzle</button>
  <button class="category" onclick="setCategory('Favorites',this)">⭐ Favorites</button>
</nav>

<section class="section">
  <div class="section-title">
    <h2 id="sectionName">All Games</h2>
    <p id="gameCount"></p>
  </div>

  <div class="games" id="games"></div>
  <div class="empty" id="empty" style="display:none">
    No games found.
  </div>
</section>

<div id="player">
  <div class="player-top">
    <button onclick="closeGame()">← Back</button>
    <h3 id="playerTitle">Game</h3>
    <button onclick="fullscreen()">⛶ Fullscreen</button>
  </div>

  <div class="player-content" id="playerContent"></div>
</div>

<script>

// GAME LIBRARY
// Add more games by adding another object here.

const gameList = [

  {
    name: "Slope",
    category: "Arcade",
    emoji: "🔴",
    color: "#172d4c",
    description: "Roll down a dangerous slope.",
    url: "https://www.coolmathgames.com/0-slope"
  },

  {
    name: "Drive Mad",
    category: "Racing",
    emoji: "🚙",
    color: "#274a36",
    description: "Drive through crazy obstacles.",
    url: "https://www.crazygames.com/game/drive-mad"
  },

  {
    name: "Vex",
    category: "Platformer",
    emoji: "🏃",
    color: "#343b50",
    description: "Complete challenging levels.",
    url: "https://www.crazygames.com/game/vex-7"
  },

  {
    name: "Geometry Dash",
    category: "Arcade",
    emoji: "🟪",
    color: "#4b285e",
    description: "Jump through obstacles.",
    url: "https://www.coolmathgames.com/0-geometry-dash"
  },

  {
    name: "Moto X3M",
    category: "Racing",
    emoji: "🏍️",
    color: "#554023",
    description: "Race through bike obstacles.",
    url: "https://www.coolmathgames.com/0-moto-x3m"
  },

  {
    name: "2048",
    category: "Puzzle",
    emoji: "🔢",
    color: "#51472c",
    description: "Combine numbers to reach 2048.",
    url: "https://play2048.co/"
  },

  {
    name: "Pac-Man",
    category: "Arcade",
    emoji: "🟡",
    color: "#554c24",
    description: "Collect points and avoid ghosts.",
    url: "https://www.google.com/logos/2010/pacman10-i.html"
  },

  {
    name: "Chess",
    category: "Puzzle",
    emoji: "♟️",
    color: "#303b49",
    description: "Play a game of chess.",
    url: "https://www.chess.com/play/computer"
  },

  {
    name: "Cookie Clicker",
    category: "Arcade",
    emoji: "🍪",
    color: "#54372a",
    description: "Click cookies and build your bakery.",
    url: "https://orteil.dashnet.org/cookieclicker/"
  },

  {
    name: "Krunker",
    category: "Arcade",
    emoji: "🎮",
    color: "#254a47",
    description: "Fast-paced browser action.",
    url: "https://krunker.io/"
  }

];

let selectedCategory = "All";
let favorites = [];

function setCategory(category,button) {
  selectedCategory = category;

  document.querySelectorAll(".category").forEach(b => {
    b.classList.remove("active");
  });

  button.classList.add("active");

  document.getElementById("sectionName").textContent =
    category === "All" ? "All Games" : category;

  renderGames();
}

function renderGames() {

  const search = document.getElementById("search")
    .value.toLowerCase();

  const container = document.getElementById("games");
  const empty = document.getElementById("empty");

  container.innerHTML = "";

  let filtered = gameList.filter(game => {

    const matchesSearch =
      game.name.toLowerCase().includes(search);

    const matchesCategory =
      selectedCategory === "All" ||
      selectedCategory === "Favorites" ||
      game.category === selectedCategory;

    const matchesFavorite =
      selectedCategory !== "Favorites" ||
      favorites.includes(game.name);

    return matchesSearch && matchesCategory && matchesFavorite;
  });

  document.getElementById("gameCount").textContent =
    filtered.length + " games";

  empty.style.display = filtered.length ? "none" : "block";

  filtered.forEach(game => {

    const index = gameList.indexOf(game);

    const card = document.createElement("div");
    card.className = "game";

    const thumbnail = document.createElement("div");
    thumbnail.className = "thumbnail";
    thumbnail.style.background = game.color;

    const emoji = document.createElement("div");
    emoji.className = "placeholder";
    emoji.textContent = game.emoji;
    thumbnail.appendChild(emoji);

    const info = document.createElement("div");
    info.className = "game-info";

    const title = document.createElement("h3");
    title.textContent = game.name;

    const description = document.createElement("p");
    description.textContent = game.description;

    const bottom = document.createElement("div");
    bottom.className = "game-bottom";

    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = game.category;

    const favorite = document.createElement("button");
    favorite.className = "favorite";
    favorite.textContent =
      favorites.includes(game.name) ? "★" : "☆";

    if(favorites.includes(game.name)) {
      favorite.classList.add("active");
    }

    favorite.onclick = event => {
      event.stopPropagation();
      toggleFavorite(game.name);
    };

    bottom.appendChild(tag);
    bottom.appendChild(favorite);

    info.appendChild(title);
    info.appendChild(description);
    info.appendChild(bottom);

    card.appendChild(thumbnail);
    card.appendChild(info);

    card.onclick = () => openGame(index);

    container.appendChild(card);
  });
}

function toggleFavorite(name) {

  if(favorites.includes(name)) {
    favorites = favorites.filter(item => item !== name);
  } else {
    favorites.push(name);
  }

  renderGames();
}

function openGame(index) {

  const game = gameList[index];

  document.getElementById("player").style.display = "block";
  document.getElementById("playerTitle").textContent = game.name;

  const content = document.getElementById("playerContent");

  content.innerHTML = "";

  const message = document.createElement("div");
  message.className = "game-message";

  const heading = document.createElement("h2");
  heading.textContent = game.name;

  const description = document.createElement("p");
  description.textContent =
    "This game is hosted on its original website. If embedding is unavailable, open it there.";

  const button = document.createElement("button");
  button.className = "play-button";
  button.textContent = "PLAY GAME ↗";

  button.onclick = () => {
    window.open(game.url, "_blank", "noopener,noreferrer");
  };

  message.appendChild(heading);
  message.appendChild(description);
  message.appendChild(button);

  content.appendChild(message);
}

function closeGame() {
  document.getElementById("player").style.display = "none";
  document.getElementById("playerContent").innerHTML = "";
}

function fullscreen() {
  const player = document.getElementById("playerContent");

  if(player.requestFullscreen) {
    player.requestFullscreen();
  }
}

renderGames();

</script>

</body>
</html>
